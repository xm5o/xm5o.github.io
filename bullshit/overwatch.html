<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overwatch 2 Stats - F0m#2582</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a252f 100%);
            color: #ffffff;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease-out;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(45deg, #f99e1a, #ffc107);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .player-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        .player-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .player-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #f99e1a;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(249, 158, 26, 0.3);
        }

        .player-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .namecard {
            width: 300px;
            height: 120px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .namecard img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .namecard-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 10px;
            text-align: left;
        }

        .battletag {
            font-size: 2rem;
            font-weight: bold;
            color: #f99e1a;
            margin-bottom: 8px;
        }

        .endorsement {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(76, 175, 80, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #4caf50;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .competitive-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .role-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
            animation: slideUp 0.8s ease-out both;
        }

        .role-card:hover {
            transform: translateY(-5px);
            border-color: #f99e1a;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .role-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #f99e1a, #ffc107);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #000;
        }

        .role-title {
            font-size: 1.1rem;
            color: #f99e1a;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tier-info {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .sr-info {
            color: #b0b0b0;
            font-size: 0.9rem;
        }

        .rank-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(249, 158, 26, 0.5);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #f99e1a;
            margin-bottom: 8px;
        }

        .stat-label {
            color: #b0b0b0;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .heroes-section {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .heroes-title {
            font-size: 1.3rem;
            color: #f99e1a;
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .heroes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }

        .hero-card {
            text-align: center;
            transition: all 0.3s ease;
        }

        .hero-card:hover {
            transform: scale(1.05);
        }

        .hero-portrait {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 10px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .hero-portrait img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-name {
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .hero-time {
            font-size: 0.8rem;
            color: #b0b0b0;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 40px;
            color: #f99e1a;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(249, 158, 26, 0.3);
            border-top: 3px solid #f99e1a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .error {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid rgba(244, 67, 54, 0.3);
            color: #f44336;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin: 20px 0;
        }

        .last-updated {
            text-align: center;
            color: #666;
            font-size: 0.8rem;
            margin-top: 30px;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .battletag {
                font-size: 1.5rem;
            }
            
            .competitive-section {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            }
            
            .heroes-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
            
            .player-banner {
                flex-direction: column;
            }
            
            .namecard {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Overwatch 2 Player Stats</h1>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <span>Loading player data...</span>
        </div>

        <div id="content" style="display: none;">
            <div class="player-card">
                <div class="player-banner">
                    <div class="player-avatar">
                        <img id="playerAvatar" src="https://d15f34w2p8l1cc.cloudfront.net/overwatch/daeddd79c84a76694d9c2eca6ee949f7b2d3a7c99e5f4a1e7eca81e8e2fc2940.png" alt="Player Avatar">
                    </div>
                    <div class="namecard">
                        <img id="namecardImage" src="https://d15f34w2p8l1cc.cloudfront.net/overwatch/8b3f1a9e6e1d4b4e8e0f7e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3.png" alt="Namecard">
                        <div class="namecard-overlay">
                            <div class="battletag" id="playerName">F0m#2582</div>
                            <div id="playerTitle" style="color: #ffffff; font-size: 0.9rem;">-</div>
                        </div>
                    </div>
                </div>
                
                <div class="endorsement">
                    <div class="status-indicator"></div>
                    <span>Endorsement Level <span id="endorsementLevel">-</span></span>
                </div>
            </div>

            <div class="competitive-section" id="competitiveRoles">
                <!-- Competitive roles will be populated here -->
            </div>

            <div class="stats-grid" id="statsGrid">
                <!-- General stats will be populated here -->
            </div>

            <div class="heroes-section" id="heroesSection">
                <div class="heroes-title">Most Played Heroes</div>
                <div class="heroes-grid" id="heroesGrid">
                    <!-- Top heroes will be populated here -->
                </div>
            </div>

            <div class="last-updated" id="lastUpdated">
                Last updated: <span id="updateTime">-</span>
            </div>
        </div>

        <div id="error" class="error" style="display: none;">
            <h3>⚠️ Unable to load player data</h3>
            <p id="errorMessage">Failed to fetch data from the API</p>
        </div>
    </div>

    <script>
        const API_URL = 'https://overfast-api.tekrop.fr/players/F0m-2582';
        const PLAYER_ID = 'F0m-2582';

        // Role icons mapping
        const roleIcons = {
            tank: '🛡️',
            damage: '⚔️',
            support: '💚'
        };

        // Tier color mapping
        const tierColors = {
            bronze: '#cd7f32',
            silver: '#c0c0c0',
            gold: '#ffd700',
            platinum: '#40e0d0',
            diamond: '#b9f2ff',
            master: '#ffb347',
            grandmaster: '#ff6b9d',
            top500: '#f0e68c'
        };

        // Rank icon mapping
        const rankIcons = {
            bronze: 'https://static.playoverwatch.com/img/pages/career/icon-rank-bronze-3.png',
            silver: 'https://static.playoverwatch.com/img/pages/career/icon-rank-silver-3.png',
            gold: 'https://static.playoverwatch.com/img/pages/career/icon-rank-gold-3.png',
            platinum: 'https://static.playoverwatch.com/img/pages/career/icon-rank-platinum-3.png',
            diamond: 'https://static.playoverwatch.com/img/pages/career/icon-rank-diamond-3.png',
            master: 'https://static.playoverwatch.com/img/pages/career/icon-rank-master-3.png',
            grandmaster: 'https://static.playoverwatch.com/img/pages/career/icon-rank-grandmaster-3.png',
            top500: 'https://static.playoverwatch.com/img/pages/career/icon-rank-top500-3.png'
        };

        async function fetchPlayerData() {
            try {
                showLoading(true);
                
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('Player data:', data);
                
                displayPlayerData(data);
                showLoading(false);
                
            } catch (error) {
                console.error('Error fetching player data:', error);
                showError(`Failed to load player data: ${error.message}`);
                showLoading(false);
            }
        }

        function displayPlayerData(data) {
            // Update player info
            document.getElementById('playerName').textContent = data.username || 'F0m#2582';
            
            if (data.avatar) {
                document.getElementById('playerAvatar').src = data.avatar;
            }
            
            if (data.namecard) {
                document.getElementById('namecardImage').src = data.namecard;
            }
            
            if (data.title) {
                document.getElementById('playerTitle').textContent = data.title;
            }
            
            if (data.endorsement && data.endorsement.level) {
                document.getElementById('endorsementLevel').textContent = data.endorsement.level;
            }

            // Display competitive roles
            displayCompetitiveRoles(data.competitive);
            
            // Display general stats
            displayGeneralStats(data);
            
            // Display top heroes
            displayTopHeroes(data);
            
            // Update last updated time
            document.getElementById('updateTime').textContent = new Date().toLocaleString();
            
            // Show content
            document.getElementById('content').style.display = 'block';
        }

        function displayCompetitiveRoles(competitive) {
            const container = document.getElementById('competitiveRoles');
            container.innerHTML = '';
            
            if (!competitive || !competitive.pc) {
                container.innerHTML = '<div class="role-card"><div class="tier-info">No competitive data available</div></div>';
                return;
            }
            
            const roles = ['tank', 'damage', 'support'];
            
            roles.forEach((role, index) => {
                const roleData = competitive.pc[role];
                const card = document.createElement('div');
                card.className = 'role-card';
                card.style.animationDelay = `${index * 0.1}s`;
                
                let content = '';
                
                if (roleData && roleData.skill_rating) {
                    const tier = roleData.tier || 'unranked';
                    const division = roleData.division || '';
                    const tierLower = tier.toLowerCase();
                    
                    content = `
                        <div class="role-icon">${roleIcons[role] || '❓'}</div>
                        <div class="role-title">${role}</div>
                        ${rankIcons[tierLower] ? `<img class="rank-icon" src="${rankIcons[tierLower]}" alt="${tier}">` : ''}
                        <div class="tier-info" style="color: ${tierColors[tierLower] || '#fff'}">
                            ${tier}${division ? ` ${division}` : ''}
                        </div>
                        <div class="sr-info">${roleData.skill_rating} SR</div>
                        ${roleData.games_played ? `<div class="sr-info">${roleData.games_played} games played</div>` : ''}
                        ${roleData.games_won ? `<div class="sr-info">${roleData.games_won} games won</div>` : ''}
                    `;
                } else {
                    content = `
                        <div class="role-icon">${roleIcons[role] || '❓'}</div>
                        <div class="role-title">${role}</div>
                        <div class="tier-info">Unranked</div>
                        <div class="sr-info">No data</div>
                    `;
                }
                
                card.innerHTML = content;
                container.appendChild(card);
            });
        }

        function displayGeneralStats(data) {
            const container = document.getElementById('statsGrid');
            const stats = [];
            
            // Add endorsement level
            if (data.endorsement && data.endorsement.level) {
                stats.push({
                    value: data.endorsement.level,
                    label: 'Endorsement Level'
                });
            }
            
            // Add competitive stats if available
            if (data.competitive && data.competitive.pc) {
                const pc = data.competitive.pc;
                let totalGames = 0;
                let totalWins = 0;
                let totalSR = 0;
                let roleCount = 0;
                
                ['tank', 'damage', 'support'].forEach(role => {
                    if (pc[role] && pc[role].games_played) {
                        totalGames += pc[role].games_played;
                        if (pc[role].games_won) {
                            totalWins += pc[role].games_won;
                        }
                        if (pc[role].skill_rating) {
                            totalSR += pc[role].skill_rating;
                            roleCount++;
                        }
                    }
                });
                
                if (totalGames > 0) {
                    stats.push({
                        value: totalGames,
                        label: 'Total Competitive Games'
                    });
                    
                    if (totalWins > 0) {
                        const winRate = Math.round((totalWins / totalGames) * 100);
                        stats.push({
                            value: `${winRate}%`,
                            label: 'Competitive Win Rate'
                        });
                    }
                }
                
                if (roleCount > 0) {
                    const averageSR = Math.round(totalSR / roleCount);
                    stats.push({
                        value: averageSR,
                        label: 'Average SR'
                    });
                }
            }
            
            // Add privacy status
            stats.push({
                value: data.privacy === 'public' ? 'Public' : 'Private',
                label: 'Profile Privacy'
            });
            
            // Add account status
            if (data.is_blizzard_employee) {
                stats.push({
                    value: 'Blizzard',
                    label: 'Employee Status'
                });
            }
            
            // Add account created date if available
            if (data.account_created_at) {
                const createdDate = new Date(data.account_created_at);
                stats.push({
                    value: createdDate.toLocaleDateString(),
                    label: 'Account Created'
                });
            }
            
            // Render stats
            container.innerHTML = '';
            stats.forEach((stat, index) => {
                const card = document.createElement('div');
                card.className = 'stat-card';
                card.style.animationDelay = `${index * 0.1}s`;
                card.innerHTML = `
                    <div class="stat-value">${stat.value}</div>
                    <div class="stat-label">${stat.label}</div>
                `;
                container.appendChild(card);
            });
            
            // If no stats available, show a message
            if (stats.length === 0) {
                container.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-value">N/A</div>
                        <div class="stat-label">No stats available</div>
                    </div>
                `;
            }
        }

        function displayTopHeroes(data) {
            const container = document.getElementById('heroesGrid');
            container.innerHTML = '';
            
            if (!data.competitive || !data.competitive.pc || !data.competitive.pc.tank || !data.competitive.pc.tank.heroes) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #b0b0b0;">No hero data available</div>';
                return;
            }
            
            // Combine heroes from all roles
            let allHeroes = [];
            ['tank', 'damage', 'support'].forEach(role => {
                if (data.competitive.pc[role] && data.competitive.pc[role].heroes) {
                    allHeroes = allHeroes.concat(Object.entries(data.competitive.pc[role].heroes));
                }
            });
            
            // Sort by time played (descending)
            allHeroes.sort((a, b) => {
                const timeA = parsePlaytime(a[1].time_played);
                const timeB = parsePlaytime(b[1].time_played);
                return timeB - timeA;
            });
            
            // Take top 10 heroes
            const topHeroes = allHeroes.slice(0, 10);
            
            if (topHeroes.length === 0) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #b0b0b0;">No hero data available</div>';
                return;
            }
            
            topHeroes.forEach(([heroName, heroData], index) => {
                const heroCard = document.createElement('div');
                heroCard.className = 'hero-card';
                heroCard.style.animationDelay = `${index * 0.1}s`;
                
                const heroPortrait = heroData.portrait || `https://d15f34w2p8l1cc.cloudfront.net/overwatch/${heroName.toLowerCase().replace(/\s+/g, '-')}.png`;
                
                heroCard.innerHTML = `
                    <div class="hero-portrait">
                        <img src="${heroPortrait}" alt="${heroName}">
                    </div>
                    <div class="hero-name">${heroName}</div>
                    <div class="hero-time">${heroData.time_played}</div>
                    ${heroData.winrate ? `<div class="hero-time">Winrate: ${heroData.winrate}</div>` : ''}
                `;
                
                container.appendChild(heroCard);
            });
        }

        function parsePlaytime(timeString) {
            // Convert time string like "10 hours", "30 minutes" to minutes
            if (!timeString) return 0;
            
            const parts = timeString.split(' ');
            if (parts.length !== 2) return 0;
            
            const value = parseInt(parts[0]);
            const unit = parts[1];
            
            if (unit.includes('hour')) return value * 60;
            if (unit.includes('minute')) return value;
            return 0;
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        function showError(message) {
            document.getElementById('error').style.display = 'block';
            document.getElementById('errorMessage').textContent = message;
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', () => {
            fetchPlayerData();
        });

        // Auto-refresh every 5 minutes
        setInterval(fetchPlayerData, 5 * 60 * 1000);
    </script>
</body>
</html>
