<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">BotDock project card</title>
  <desc id="desc">Technical project artwork made from vector shapes and text.</desc>
  <rect width="1200" height="650" fill="#090b0e"/>
  <g stroke="#1a2228" stroke-width="1">
    <path d="M0 130H1200M0 260H1200M0 390H1200M0 520H1200"/>
    <path d="M200 0V650M400 0V650M600 0V650M800 0V650M1000 0V650"/>
  </g>
  <rect x="70" y="65" width="1060" height="520" rx="34" fill="#0d1115" stroke="#243039" stroke-width="3"/>
  <text x="120" y="165" fill="#8dc3d6" font-family="Arial, sans-serif" font-size="64" font-weight="800">BOTDOCK</text>
  <text x="120" y="210" fill="#76838e" font-family="Arial, sans-serif" font-size="26" letter-spacing="4">LOCAL PROCESS MANAGER</text>
  <g transform="translate(120 300)">
    <rect x="0" y="0" width="245" height="150" rx="20" fill="#121820" stroke="#2b3842"/>
    <circle cx="42" cy="42" r="9" fill="#5bc28b"/>
    <text x="68" y="50" fill="#e7edf1" font-family="Arial, sans-serif" font-size="27" font-weight="700">Selina</text>
    <text x="28" y="102" fill="#7c8994" font-family="monospace" font-size="20">PID 4280</text>
    <text x="28" y="132" fill="#8dc3d6" font-family="monospace" font-size="18">RUNNING</text>
  </g>
  <g transform="translate(390 300)">
    <rect x="0" y="0" width="245" height="150" rx="20" fill="#121820" stroke="#2b3842"/>
