    <text x="68" y="50" fill="#e7edf1" font-family="Arial, sans-serif" font-size="27" font-weight="700">Music Bot</text>
    <text x="28" y="102" fill="#7c8994" font-family="monospace" font-size="20">CPU 1.3%</text>
    <text x="28" y="132" fill="#8dc3d6" font-family="monospace" font-size="18">94 MB</text>
  </g>
  <g transform="translate(660 300)">
