<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,follow">
  <title>404 - Lost in the Void</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --surface: #0b0b0c;
      --surface-hover: #121214;
      --text: #f5f5f7;
      --muted: #8d8d95;
      --faint: #343438;
      --border: #202024;
      --focus: #fff;
      --cube-out: cubic-bezier(.215,.61,.355,1);
      --back-out: cubic-bezier(.34,1.56,.64,1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
      overscroll-behavior-y: none;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% 30%, rgba(255,255,255,.035), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    main {
      width: min(680px, calc(100% - 36px));
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding:
        max(32px, env(safe-area-inset-top))
        0
        max(32px, env(safe-area-inset-bottom));
      display: grid;
      place-items: center;
    }

    .error {
      width: 100%;
      text-align: center;
    }

    .error-code {
      margin: 0 0 26px;
      color: var(--faint);
      font-size: clamp(112px, 23vw, 250px);
      font-weight: 800;
      line-height: .72;
      letter-spacing: -.12em;
      font-variant-numeric: tabular-nums;
      user-select: none;
      transform-origin: center;
      will-change: transform, color;
      animation: code-intro 1.08s var(--cube-out) .08s both;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 52px);
      line-height: 1.02;
      letter-spacing: -.045em;
      font-weight: 750;
      opacity: 0;
      transform: translateY(22px) scale(.96);
      animation: title-intro .72s var(--cube-out) .78s forwards;
    }

    .subtitle {
      max-width: 500px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: clamp(16px, 2.4vw, 18px);
      line-height: 1.65;
      opacity: 0;
      transform: translateY(16px);
      animation: copy-intro .66s var(--cube-out) 1.08s forwards;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 32px;
      flex-wrap: wrap;
    }

    .action {
      min-height: 48px;
      min-width: 142px;
      padding: 0 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: var(--text);
      background: var(--surface);
      text-decoration: none;
      font: inherit;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
      opacity: 0;
      transform: translateY(24px) scale(.88);
      transition:
        background-color .18s ease,
        border-color .18s ease,
        transform .18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .action:nth-child(1) {
      animation: button-intro .62s var(--back-out) 1.82s forwards;
    }

    .action:nth-child(2) {
      animation: button-intro .62s var(--back-out) 1.92s forwards;
    }

    .action.primary {
      background: var(--text);
      color: #080808;
      border-color: var(--text);
    }

    .action:hover {
      background: var(--surface-hover);
      border-color: #38383d;
      transform: translateY(-1px);
    }

    .action.primary:hover {
      background: #fff;
      border-color: #fff;
    }

    .action:active {
      transform: translateY(0);
    }

    .action:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    .action svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
    }

    .home-mark {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      opacity: .7;
    }

    @keyframes code-intro {
      0%,
      26% {
        color: var(--text);
        opacity: 1;
        transform: scale(1.72);
      }

      100% {
        color: var(--faint);
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes title-intro {
      0% {
        opacity: 0;
        transform: translateY(22px) scale(.96);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes copy-intro {
      0% {
        opacity: 0;
        transform: translateY(16px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes button-intro {
      0% {
        opacity: 0;
        transform: translateY(24px) scale(.88);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 560px) {
      body {
        background: var(--bg);
      }

      main {
        width: min(100% - 28px, 680px);
        padding:
          max(24px, env(safe-area-inset-top))
          0
          max(24px, env(safe-area-inset-bottom));
      }

      .error-code {
        margin-bottom: 22px;
        font-size: clamp(100px, 34vw, 148px);
      }

      h1 {
        font-size: clamp(30px, 9vw, 38px);
      }

      .subtitle {
        max-width: 340px;
        margin-top: 14px;
        font-size: 16px;
        line-height: 1.6;
      }

      .actions {
        display: grid;
        width: min(100%, 340px);
        margin: 28px auto 0;
      }

      .action {
        width: 100%;
        min-height: 50px;
      }

      @keyframes code-intro {
        0%,
        26% {
          color: var(--text);
          opacity: 1;
          transform: scale(1.92);
        }

        100% {
          color: var(--faint);
          opacity: 1;
          transform: scale(1);
        }
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }

      .error-code,
      h1,
      .subtitle,
      .action {
        opacity: 1 !important;
        transform: none !important;
      }
    }

    @media (prefers-contrast: more) {
      :root {
        --muted: #b8b8bf;
        --border: #5b5b62;
        --faint: #595960;
      }
    }
  </style>

  <script defer src="scripts/i18n.js"></script>
</head>
<body class="not-found-page">
  <main>
    <section class="error" aria-labelledby="error-title">
      <p class="error-code" aria-hidden="true">404</p>

      <h1 id="error-title">Lost in the Void</h1>
      <p class="subtitle">
        This page has drifted beyond the digital horizon. Let's navigate you back to familiar territory.
      </p>

      <nav class="actions" aria-label="404 navigation">
        <a class="action primary" href="/">
          <span class="home-mark" aria-hidden="true"></span>
          <span>Back to home</span>
        </a>

        <button class="action" id="go-back" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M19 12H5"></path>
            <path d="m12 19-7-7 7-7"></path>
          </svg>
          <span>Go Back</span>
        </button>
      </nav>
    </section>
  </main>

  <script>
    (() => {
      const back = document.getElementById('go-back');

      back.addEventListener('click', () => {
        const sameSiteReferrer = (() => {
          if (!document.referrer) return false;
          try {
            return new URL(document.referrer).origin === location.origin;
          } catch {
            return false;
          }
        })();

        if (history.length > 1 && sameSiteReferrer) {
          history.back();
          return;
        }

        location.href = '/';
      });
    })();
  </script>

  <script type="module" src="scripts/analytics.js"></script>
</body>
</html>
