<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>Immortal Admin · Offline</title>
  <style>
    *{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#070707;color:#eee;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(430px,100%);border:1px solid #222;border-radius:20px;background:#0d0d0d;padding:24px}.icon{display:grid;place-items:center;width:48px;height:48px;border:1px solid #292929;border-radius:14px;background:#111;font-weight:800}.eyebrow{display:block;margin-top:22px;color:#666;font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}h1{margin:7px 0 10px;font-size:1.8rem;letter-spacing:-.04em}p{margin:0;color:#7c7c7c;font-size:.76rem;line-height:1.65}.actions{display:flex;gap:8px;margin-top:20px}button,a{display:inline-flex;align-items:center;justify-content:center;min-height:42px;border-radius:10px;padding:0 14px;font:inherit;font-size:.72rem;text-decoration:none;cursor:pointer}button{border:1px solid #eee;background:#eee;color:#111;font-weight:700}a{border:1px solid #2a2a2a;background:#111;color:#aaa}@media(max-width:520px){.actions{display:grid}.actions>*{width:100%}}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">I</div>
    <span class="eyebrow">Immortal Admin</span>
    <h1>You’re offline.</h1>
    <p>The admin shell is available, but publishing and GitHub-backed data need a connection. Any draft that is still open in your current tab remains there until you close or reload it.</p>
    <div class="actions"><button type="button" onclick="location.reload()">Try again</button><a href="/admin/profile/">Open cached admin</a></div>
  </main>
</body>
</html>
