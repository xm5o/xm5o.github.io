<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#070707">
  <title>Immortal Admin · Staging Preview</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#070707;color:#ddd;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;grid-template-rows:48px 1fr;overflow:hidden}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;border-bottom:1px solid #1d1d1d;background:#0b0b0b}.bar div{display:flex;align-items:center;gap:9px;min-width:0}.dot{width:8px;height:8px;border-radius:50%;background:#b7a96e;box-shadow:0 0 12px rgba(183,169,110,.24)}strong{font-size:.72rem}small{color:#666;font-size:.6rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar a,.bar button{border:1px solid #272727;border-radius:8px;background:#111;color:#aaa;padding:7px 10px;text-decoration:none;font-size:.62rem;cursor:pointer}.bar a:hover,.bar button:hover{color:#eee;border-color:#383838}iframe{width:100%;height:100%;border:0;background:#080808}.empty{position:fixed;inset:48px 0 0;z-index:4;display:none;place-items:center;text-align:center;padding:24px;background:#080808}.empty div{max-width:460px}.empty h1{font-size:1.2rem}.empty p{color:#777;font-size:.72rem;line-height:1.6}.empty a{color:#ccc}@media(max-width:640px){.bar small{display:none}.bar a{display:none}}
  </style>
</head>
<body>
  <header class="bar"><div><span class="dot"></span><strong>Local staging preview</strong><small id="stageStatus">Reading your saved draft…</small></div><div><button id="refreshStage" type="button">Refresh draft</button><a href="./">Back to Admin</a></div></header>
  <iframe id="stageFrame" src="../../?siteManagerPreview=stage" title="Immortal staged homepage preview"></iframe>
  <div class="empty" id="stageEmpty"><div><h1>No saved draft yet</h1><p>Stage something in Immortal Admin first. This preview is browser-local and never becomes public until you use Publish All.</p><a href="./">Return to Immortal Admin</a></div></div>
  <script type="module" src="stage.js?v=20260916-1"></script>
</body>
</html>
