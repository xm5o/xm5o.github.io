name: Integrate analytics v2 once

on:
  push:
    branches:
      - analytics-v2-2026-09-11
    paths:
      - .github/workflows/analytics-v2-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analytics-v2-2026-09-11
          fetch-depth: 0

      - name: Patch site pages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements=(), before_body_script=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  if old in text and new not in text:
                      text = text.replace(old, new, 1)
              if before_body_script and before_body_script not in text:
                  text = text.replace('</body>', f'  {before_body_script}\n</body>', 1)
              if text != original:
                  p.write_text(text, encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          if 'css/analytics.css' not in text:
              text = text.replace(
                  '<link rel="stylesheet" href="css/loading.css" />',
                  '<link rel="stylesheet" href="css/loading.css" />\n  <link rel="stylesheet" href="css/analytics.css" />',
                  1
              )

          views_card = '''        <div class="site-views-card" aria-label="Site traffic summary">
          <i class="bx bx-show" aria-hidden="true"></i>
          <span>Site Views <strong id="visitorCount" data-value="0">—</strong></span>
          <span class="today-views">Today <strong id="todayVisits">—</strong></span>
        </div>\n\n'''
          if 'id="visitorCount"' not in text:
              text = text.replace('        <ul class="footer-nav">', views_card + '        <ul class="footer-nav">', 1)

          analytics_script = '  <script type="module" src="scripts/analytics.js"></script>\n'
          if 'src="scripts/analytics.js"' not in text:
              text = text.replace('  <script src="scripts/faq.js"></script>\n', '  <script src="scripts/faq.js"></script>\n' + analytics_script, 1)
          index.write_text(text, encoding='utf-8')

          patch('404.html', before_body_script='<script type="module" src="scripts/analytics.js"></script>')
          patch('commission/index.html', before_body_script='<script type="module" src="../scripts/analytics.js"></script>')
          patch('selina/index.html', before_body_script='<script type="module" src="../scripts/analytics.js"></script>')

          tracker = Path('scripts/analytics.js')
          text = tracker.read_text(encoding='utf-8')
          text = text.replace("fetch('https://ipapi.co/json/'", "fetch('https://ipwho.is/'")
          text = text.replace("if (data?.error) return { ...UNKNOWN_LOCATION };", "if (data?.success === false) return { ...UNKNOWN_LOCATION };")
          text = text.replace("country: data.country_name || 'Unknown',", "country: data.country || 'Unknown',")
          tracker.write_text(text, encoding='utf-8')

          privacy = Path('privacy.html')
          text = privacy.read_text(encoding='utf-8').replace('ipapi.co', 'ipwho.is')
          privacy.write_text(text, encoding='utf-8')
          PY

      - name: Verify integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              'index analytics CSS': 'css/analytics.css' in Path('index.html').read_text(),
              'index view counter': 'id="visitorCount"' in Path('index.html').read_text(),
              'index tracker': 'scripts/analytics.js' in Path('index.html').read_text(),
              'commission tracker': '../scripts/analytics.js' in Path('commission/index.html').read_text(),
              'selina tracker': '../scripts/analytics.js' in Path('selina/index.html').read_text(),
              '404 tracker': 'scripts/analytics.js' in Path('404.html').read_text(),
              'dashboard exists': Path('analytics.html').exists(),
              'tracker uses ipwho.is': 'https://ipwho.is/' in Path('scripts/analytics.js').read_text(),
              'tracker has no fingerprinting': 'generateDeviceFingerprint' not in Path('scripts/analytics.js').read_text(),
              'tracker does not persist raw IP': "ip:" not in Path('scripts/analytics.js').read_text(),
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Verification failed: ' + ', '.join(failed))
          print('All analytics v2 integration checks passed.')
          PY

      - name: Commit integration and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analytics-v2-once.yml
          git add index.html 404.html commission/index.html selina/index.html privacy.html scripts/analytics.js
          git commit -m "Integrate privacy-friendly analytics across site"
          git push origin analytics-v2-2026-09-11
