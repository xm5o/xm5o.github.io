name: Integrate analytics v2

on:
  push:
    branches:
      - analytics-v2-2026-09-11
    paths:
      - ".github/workflows/analytics-v2-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: analytics-v2-2026-09-11
          fetch-depth: 0

      - name: Apply analytics integration
        run: python3 scripts/apply-analytics-v2.py

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analytics-v2-once.yml scripts/apply-analytics-v2.py
          git add index.html 404.html commission/index.html selina/index.html privacy.html scripts/analytics.js
          git commit -m "Integrate privacy-friendly analytics across site"
          git push origin analytics-v2-2026-09-11
