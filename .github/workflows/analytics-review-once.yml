name: Final analytics v2 review

on:
  push:
    branches:
      - analytics-v2-2026-09-11
    paths:
      - ".github/workflows/analytics-review-once.yml"

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: analytics-v2-2026-09-11
          fetch-depth: 0

      - name: Finalize analytics files
        run: python3 scripts/finalize-analytics-v2.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --input-type=module --check < scripts/analytics.js
          node --input-type=module --check < scripts/analytics-dashboard.js

      - name: Commit reviewed version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/analytics-review-once.yml scripts/finalize-analytics-v2.py
          git add 404.html scripts/analytics.js
          git commit -m "Polish and verify analytics v2"
          git push origin analytics-v2-2026-09-11
