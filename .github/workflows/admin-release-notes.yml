name: Generate admin release notes

on:
  push:
    branches: [main]
    paths:
      - 'admin/profile/release.json'
      - 'admin/profile/release-beta.json'
      - 'scripts/generate-admin-release-notes.mjs'
      - '.github/workflows/admin-release-notes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Generate stable notes
        env:
          RELEASE_FILE: admin/profile/release.json
          RELEASE_NOTES_FILE: admin/profile/release-notes.generated.json
        run: node scripts/generate-admin-release-notes.mjs
      - name: Generate beta notes
        env:
          RELEASE_FILE: admin/profile/release-beta.json
          RELEASE_NOTES_FILE: admin/profile/release-notes.beta.generated.json
        run: node scripts/generate-admin-release-notes.mjs
      - name: Commit generated release notes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/profile/release-notes.generated.json admin/profile/release-notes.beta.generated.json
          if git diff --cached --quiet; then
            echo 'Release notes already current.'
            exit 0
          fi
          git commit -m 'Generate Immortal Admin release notes'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git rebase origin/main
              RELEASE_FILE=admin/profile/release.json RELEASE_NOTES_FILE=admin/profile/release-notes.generated.json node scripts/generate-admin-release-notes.mjs
              RELEASE_FILE=admin/profile/release-beta.json RELEASE_NOTES_FILE=admin/profile/release-notes.beta.generated.json node scripts/generate-admin-release-notes.mjs
              git add admin/profile/release-notes.generated.json admin/profile/release-notes.beta.generated.json
              git commit --amend --no-edit
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo 'Could not push generated release notes after retries.' >&2
          exit 1
