name: XM5O Guard deploy verification

on:
  workflow_run:
    workflows:
      - pages build and deployment
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    name: Verify production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install production browser dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify live deployment
        env:
          SITE_URL: https://xm5o.github.io
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node tests/site-deploy-verify.mjs
      - name: Upload production verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xm5o-guard-deploy
          path: artifacts/xm5o-guard/deploy.md
          if-no-files-found: ignore
          retention-days: 30
