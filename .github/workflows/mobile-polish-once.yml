name: Mobile performance polish once

on:
  push:
    branches:
      - mobile-performance-polish-2026-09-11
    paths:
      - '.github/workflows/mobile-polish-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout polish branch
        uses: actions/checkout@v4
        with:
          ref: mobile-performance-polish-2026-09-11
          fetch-depth: 0

      - name: Apply focused polish
        run: python3 .github/scripts/apply_mobile_polish.py

      - name: Validate JavaScript
        run: |
          node --check scripts/about.js
          node --check scripts/navbar.js
          node --check scripts/home.js
          node --check scripts/script.js

      - name: Validate expected HTML changes
        run: |
          grep -q 'href="commission/index.html" class="cta-btn commission-cta' index.html
          grep -q 'scripts/about.js' index.html
          ! grep -q '// About Me Tab Switching Logic' index.html

      - name: Remove one-time tooling and commit
        run: |
          rm -f .github/workflows/mobile-polish-once.yml
          rm -f .github/scripts/apply_mobile_polish.py
          rmdir .github/scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish mobile layout and performance"
          git push origin HEAD:mobile-performance-polish-2026-09-11
