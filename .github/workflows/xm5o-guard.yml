name: XM5O Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xm5o-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard site integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run XM5O Guard
        env:
          XM5O_GUARD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tests/site-guard.mjs
