name: Analytics dedupe v4 once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/analytics-dedupe-v4-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply dedupe patch
        run: python3 .github/scripts/analytics_dedupe_patch.py

      - name: Validate tracker
        run: |
          node --input-type=module --check < scripts/analytics.js
          grep -q "return storageOk || cookieOk" scripts/analytics.js
          grep -q "skip the unique count" scripts/analytics.js
          grep -q "Roll back markers" scripts/analytics.js

      - name: Commit fix and remove one-time tooling
        run: |
          rm -f .github/workflows/analytics-dedupe-v4-once.yml
          rm -f .github/scripts/analytics_dedupe_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden unique visitor deduplication"
          git push origin HEAD:main
