<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apocalypse - Animated Lyrics</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            position: relative;
            color: white;
        }

        body.hide-cursor {
            cursor: none;
        }

        /* Bottom Control Player */
        .control-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.8));
            backdrop-filter: blur(20px);
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s ease-in-out;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .control-player.show {
            transform: translateY(0);
        }

        .control-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .control-center {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1;
            justify-content: center;
        }

        .control-right {
            min-width: 120px;
            text-align: right;
        }

        .song-meta {
            display: flex;
            flex-direction: column;
        }

        .song-meta .title {
            font-size: 0.9rem;
            font-weight: 500;
            color: #ffffff;
        }

        .song-meta .artist {
            font-size: 0.8rem;
            color: #999999;
        }

        .control-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .play-control {
            background: #ffffff;
            color: #000000;
            width: 40px;
            height: 40px;
        }

        .play-control:hover {
            background: #cccccc;
        }

        .progress-container {
            flex: 1;
            max-width: 400px;
            margin: 0 20px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: #ffffff;
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s ease;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #999999;
            margin-top: 5px;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-slider {
            width: 80px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .volume-fill {
            height: 100%;
            background: #ffffff;
            border-radius: 2px;
            width: 100%;
        }

        .lyrics-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .lyric-line {
            position: absolute;
            font-size: clamp(1.8rem, 4vw, 3.5rem);
            font-weight: 400;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            white-space: nowrap;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6), 
                         0 0 30px rgba(255, 255, 255, 0.4);
            letter-spacing: 0.5px;
        }

        .lyric-line.active {
            opacity: 1;
        }

        .lyric-line.fade-out {
            opacity: 0;
        }

        .song-info {
            background: #000000;
            max-width: 400px;
            max-height: 400px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 100;
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            opacity: 1;
        }

        .song-info.hide {
            opacity: 0;
            transform: translate(-50%, -60%) scale(0.9);
            pointer-events: none;
        }

        .song-title {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 300;
            margin-bottom: 20px;
            color: #ffffff;
            letter-spacing: 3px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        }

        .artist-name {
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: #999999;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 40px;
        }

        .play-btn {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 16px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .play-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .play-btn:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.08));
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.1);
        }

        .play-btn:hover::before {
            left: 100%;
        }

        .play-btn:active {
            transform: translateY(0);
        }

        /* Position classes with better spacing */
        .pos-center {
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .pos-top-left {
            left: 8%;
            top: 20%;
        }

        .pos-top-right {
            right: 8%;
            top: 25%;
        }

        .pos-bottom-left {
            left: 10%;
            bottom: 30%;
        }

        .pos-bottom-right {
            right: 10%;
            bottom: 25%;
        }

        .pos-center-left {
            left: 15%;
            top: 55%;
        }

        .pos-center-right {
            right: 15%;
            top: 45%;
        }

        .pos-top-center {
            left: 50%;
            top: 15%;
            transform: translateX(-50%);
        }

        .pos-bottom-center {
            left: 50%;
            bottom: 20%;
            transform: translateX(-50%);
        }

        /* Loading animation */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 200;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .loading.show {
            opacity: 1;
        }

        .loading-text {
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-align: center;
            animation: fade-pulse 1.5s ease-in-out infinite;
        }

        @keyframes fade-pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Debug seconds display */
        .debug-seconds {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Inter', monospace;
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 1001;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            display: none;
        }

        .debug-seconds.show {
            display: block;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .song-title {
                font-size: 3rem;
                letter-spacing: 2px;
            }
            
            .artist-name {
                font-size: 1.2rem;
            }
            
            .lyric-line {
                font-size: 1.8rem;
                padding: 0 20px;
            }
        }
    </style>
</head>
<body>
    <div class="song-info" id="songInfo">
        <div class="song-title">APOCALYPSE</div>
        <div class="artist-name">CIGARETTES AFTER SEX</div>
        <button class="play-btn" id="playBtn">PLAY</button>
    </div>

    <div class="loading" id="loading">
        <div class="loading-text">STARTING...</div>
    </div>

    <div class="debug-seconds" id="debugSeconds">0.000</div>

    <div class="lyrics-container" id="lyricsContainer">
    </div>

    <!-- Bottom Control Player -->
    <div class="control-player" id="controlPlayer">
        <div class="control-left">
            <div class="song-meta">
                <div class="title">Apocalypse</div>
                <div class="artist">Cigarettes After Sex</div>
            </div>
        </div>

        <div class="control-center">
            <!-- <button class="control-btn" id="prevBtn">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                    <path d="M6.271 5.055a.5.5 0 0 1 .52.098L9.5 7.5a.5.5 0 0 1 0 .707L6.79 10.854a.5.5 0 0 1-.79-.4V5.5a.5.5 0 0 1 .271-.445z"/>
                </svg>
            </button> -->

            <button class="control-btn play-control" id="controlPlayBtn">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16" id="playIcon">
                    <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/>
                </svg>
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16" id="pauseIcon" style="display: none;">
                    <path d="M5.5 3.5A1.5 1.5 0 0 1 7 2h2a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 9 14H7a1.5 1.5 0 0 1-1.5-1.5v-9z"/>
                </svg>
            </button>

            <!-- <button class="control-btn" id="nextBtn">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                    <path d="M9.729 5.055a.5.5 0 0 0-.52.098L6.5 7.5a.5.5 0 0 0 0 .707l2.71 2.647a.5.5 0 0 0 .79-.4V5.5a.5.5 0 0 0-.271-.445z"/>
                </svg>
            </button> -->

            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>
            </div>
        </div>

        <div class="control-right">
            <div class="volume-container">
                <button class="control-btn" id="volumeBtn">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M10.717 3.55A.5.5 0 0 1 11 4v8a.5.5 0 0 1-.812.39L7.825 10.5H5.5A.5.5 0 0 1 5 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06z"/>
                    </svg>
                </button>
                <div class="volume-slider" id="volumeSlider">
                    <div class="volume-fill" id="volumeFill"></div>
                </div>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" preload="auto">
        <source src="Apocalypse.ogg" type="audio/ogg">
        Your browser does not support the audio element.
    </audio>

    <script>
        // Lyrics for Apocalypse
        const lyricsData = [
            { lyric: "You leapt from crumbling bridges watching cityscapes turn to dust", time: 0, pos: "pos-center", duration: 12000, color: "#ffffff", textAlign: "center" },
            { lyric: "Filming helicopters crashing in the ocean from way above", time: 15, pos: "pos-center", duration: 10000, color: "#ffffff", textAlign: "center" },
            { lyric: "Got the music in you baby, tell me why", time: 25, pos: "pos-center", duration: 8000, color: "#ffffff", textAlign: "center" },
            { lyric: "Got the music in you baby, tell me why", time: 35, pos: "pos-center", duration: 8000, color: "#ffffff", textAlign: "center" },
            { lyric: "You've been locked in here forever & you just can't say goodbye", time: 45, pos: "pos-center", duration: 10000, color: "#ffffff", textAlign: "center" },
            { lyric: "Kisses on the foreheads of the lovers wrapped in your arms", time: 60, pos: "pos-center", duration: 10000, color: "#ffffff", textAlign: "center" },
            { lyric: "You've been hiding them in hollowed-out pianos left in the dark", time: 75, pos: "pos-center", duration: 10000, color: "#ffffff", textAlign: "center" },
            { lyric: "Your lips, my lips, Apocalypse", time: 90, pos: "pos-center", duration: 8000, color: "#ffffff", textAlign: "center" },
            { lyric: "Go & sneak us through the rivers, flood is rising up on your knees", time: 110, pos: "pos-center", duration: 12000, color: "#ffffff", textAlign: "center" },
            { lyric: "Oh please… Come out & haunt me, I know you want me", time: 130, pos: "pos-center", duration: 8000, color: "#ffffff", textAlign: "center" },
            { lyric: "Sharing all your secrets with each other since you were kids", time: 150, pos: "pos-center", duration: 10000, color: "#ffffff", textAlign: "center" },
            { lyric: "Sleeping soundly with the locket that she gave you clutched in your fist", time: 170, pos: "pos-center", duration: 10000, color: "#ffffff", textAlign: "center" },
            { lyric: "When you're all alone I will reach for you", time: 190, pos: "pos-center", duration: 10000, color: "#ffffff", textAlign: "center" },
            { lyric: "When you're feeling low I will be there too", time: 205, pos: "pos-center", duration: 10000, color: "#ffffff", textAlign: "center" }
        ];

        // Debug Settings
        const debugSettings = {
            ShowSongSeconds: false
        };

        const audioPlayer = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const songInfo = document.getElementById('songInfo');
        const loading = document.getElementById('loading');
        const lyricsContainer = document.getElementById('lyricsContainer');
        const debugSeconds = document.getElementById('debugSeconds');
        
        // Control player elements
        const controlPlayer = document.getElementById('controlPlayer');
        const controlPlayBtn = document.getElementById('controlPlayBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeDisplay = document.getElementById('currentTime');
        const totalTimeDisplay = document.getElementById('totalTime');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeFill = document.getElementById('volumeFill');
        
        let isPlaying = false;
        let currentLyricIndex = 0;
        let activeLyrics = [];
        let controlPlayerVisible = false;
        let hideControlTimeout;
        let simulatedStartTime = 0;

        // Show debug seconds if enabled
        if (debugSettings.ShowSongSeconds) {
            debugSeconds.classList.add('show');
        }

        // Show/hide control player
        function showControlPlayer() {
            controlPlayer.classList.add('show');
            controlPlayerVisible = true;
            document.body.style.cursor = 'default';
            
            // Clear existing timeout
            if (hideControlTimeout) {
                clearTimeout(hideControlTimeout);
            }
        }

        function hideControlPlayer() {
            if (isPlaying) {
                controlPlayer.classList.remove('show');
                controlPlayerVisible = false;
                document.body.classList.add('hide-cursor');
            }
        }

        function scheduleHideControl() {
            if (hideControlTimeout) {
                clearTimeout(hideControlTimeout);
            }
            
            hideControlTimeout = setTimeout(() => {
                if (isPlaying && !controlPlayer.matches(':hover')) {
                    hideControlPlayer();
                }
            }, 3000);
        }

        // Mouse movement detection
        document.addEventListener('mousemove', (e) => {
            if (isPlaying) {
                const windowHeight = window.innerHeight;
                const mouseY = e.clientY;
                
                // Show control if mouse is in bottom 100px or control is visible
                if (mouseY > windowHeight - 120 || controlPlayerVisible) {
                    showControlPlayer();
                    scheduleHideControl();
                }
            }
        });

        // Control player hover
        controlPlayer.addEventListener('mouseenter', () => {
            if (isPlaying) {
                showControlPlayer();
                if (hideControlTimeout) {
                    clearTimeout(hideControlTimeout);
                }
            }
        });

        controlPlayer.addEventListener('mouseleave', () => {
            if (isPlaying) {
                scheduleHideControl();
            }
        });

        // Create lyric elements with enhanced positioning
        function createLyricElement(lyricData, index) {
            const lyricDiv = document.createElement('div');
            
            // Apply position class or custom x/y coordinates
            if (lyricData.pos) {
                lyricDiv.className = `lyric-line ${lyricData.pos}`;
            } else {
                lyricDiv.className = 'lyric-line';
                
                // Use custom x/y coordinates or default to center
                const x = lyricData.x || '50%';
                const y = lyricData.y || '50%';
                
                lyricDiv.style.left = x;
                lyricDiv.style.top = y;
                lyricDiv.style.transform = 'translate(-50%, -50%)';
            }
            
            lyricDiv.textContent = lyricData.lyric;
            lyricDiv.id = `lyric-${index}`;
            
            // Apply custom styling if provided
            if (lyricData.fontSize) {
                lyricDiv.style.fontSize = lyricData.fontSize;
            }
            
            if (lyricData.color) {
                lyricDiv.style.color = lyricData.color;
                // Update glow color to match text color
                const r = parseInt(lyricData.color.slice(1, 3), 16);
                const g = parseInt(lyricData.color.slice(3, 5), 16);
                const b = parseInt(lyricData.color.slice(5, 7), 16);
                lyricDiv.style.textShadow = `0 0 15px rgba(${r}, ${g}, ${b}, 0.6), 0 0 30px rgba(${r}, ${g}, ${b}, 0.4)`;
            }
            
            if (lyricData.textAlign) {
                lyricDiv.style.textAlign = lyricData.textAlign;
            }
            
            lyricsContainer.appendChild(lyricDiv);
            return lyricDiv;
        }

        // Initialize all lyric elements
        lyricsData.forEach((lyric, index) => {
            createLyricElement(lyric, index);
        });

        // Show lyric with animation
        function showLyric(index) {
            const lyricElement = document.getElementById(`lyric-${index}`);
            const lyricData = lyricsData[index];
            
            lyricElement.classList.add('active');
            activeLyrics.push({
                element: lyricElement,
                hideTime: Date.now() + lyricData.duration
            });

            // Schedule hide animation
            setTimeout(() => {
                lyricElement.classList.add('fade-out');
                setTimeout(() => {
                    lyricElement.classList.remove('active', 'fade-out');
                }, 1000);
            }, lyricData.duration);
        }

        // Update lyrics based on audio time
        function updateLyrics() {
            if (!isPlaying) return;

            const currentTime = audioPlayer.currentTime;

            // Update debug seconds display
            if (debugSettings.ShowSongSeconds) {
                debugSeconds.textContent = currentTime.toFixed(3);
            }

            // Check for new lyrics to show
            while (currentLyricIndex < lyricsData.length && 
                   lyricsData[currentLyricIndex].time <= currentTime) {
                showLyric(currentLyricIndex);
                currentLyricIndex++;
            }

            updateProgress();
            requestAnimationFrame(updateLyrics);
        }

        // Start sequence animation
        function startSequence() {
            // First, hide the song info
            songInfo.classList.add('hide');
            
            // Show loading after brief delay
            setTimeout(() => {
                loading.classList.add('show');
            }, 800);

            // Start music and lyrics after loading delay
            setTimeout(() => {
                loading.classList.remove('show');
                
                audioPlayer.play().then(() => {
                    isPlaying = true;
                    playBtn.textContent = 'PAUSE';
                    playBtn.style.pointerEvents = 'auto';
                    updateControlPlayerState();
                    updateLyrics();
                    scheduleHideControl();
                }).catch(error => {
                    console.log('Audio play failed:', error);
                    // If audio fails, still show lyrics for demo
                    isPlaying = true;
                    playBtn.textContent = 'PAUSE';
                    playBtn.style.pointerEvents = 'auto';
                    updateControlPlayerState();
                    simulateAudioTime();
                    scheduleHideControl();
                });
            }, 2500);
        }

        // Format time helper
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Update progress bar and time
        function updateProgress() {
            const currentTime = audioPlayer.currentTime || 0;
            const duration = audioPlayer.duration || 0;
            
            // Update progress bar
            const progress = duration > 0 ? (currentTime / duration) * 100 : 0;
            progressFill.style.width = progress + '%';
            
            // Update time displays
            currentTimeDisplay.textContent = formatTime(currentTime);
            totalTimeDisplay.textContent = formatTime(duration);
        }

        // Progress bar click handling
        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percentage = clickX / rect.width;
            const newTime = percentage * audioPlayer.duration;
            
            audioPlayer.currentTime = newTime;
            
            // Reset lyrics to match new time
            currentLyricIndex = 0;
            document.querySelectorAll('.lyric-line').forEach(lyric => {
                lyric.classList.remove('active', 'fade-out');
            });
            
            // Find correct lyric index for new time
            for (let i = 0; i < lyricsData.length; i++) {
                if (lyricsData[i].time > newTime) {
                    currentLyricIndex = i;
                    break;
                }
            }
        });

        // Volume control
        volumeSlider.addEventListener('click', (e) => {
            const rect = volumeSlider.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percentage = clickX / rect.width;
            
            audioPlayer.volume = percentage;
            volumeFill.style.width = (percentage * 100) + '%';
        });

        // Control play button
        controlPlayBtn.addEventListener('click', () => {
            playBtn.click(); // Use existing play button logic
        });

        // Update control player button state
        function updateControlPlayerState() {
            if (isPlaying) {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            } else {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        }

        // Play/Pause functionality
        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                // Pause functionality
                audioPlayer.pause();
                isPlaying = false;
                playBtn.textContent = 'RESUME';
                playBtn.style.pointerEvents = 'auto';
                updateControlPlayerState();
                
                // Show song info and controls when paused
                songInfo.classList.remove('hide');
                showControlPlayer();
                if (hideControlTimeout) {
                    clearTimeout(hideControlTimeout);
                }
                
            } else if (audioPlayer.currentTime > 0 && !audioPlayer.ended) {
                // Resume functionality
                songInfo.classList.add('hide');
                
                audioPlayer.play().then(() => {
                    isPlaying = true;
                    playBtn.textContent = 'PAUSE';
                    updateControlPlayerState();
                    updateLyrics();
                    scheduleHideControl();
                }).catch(error => {
                    console.log('Audio resume failed:', error);
                    isPlaying = true;
                    playBtn.textContent = 'PAUSE';
                    updateControlPlayerState();
                    simulateAudioTime();
                    scheduleHideControl();
                });
            } else {
                // Start from beginning
                playBtn.textContent = 'STARTING...';
                playBtn.style.pointerEvents = 'none';
                currentLyricIndex = 0;
                
                document.querySelectorAll('.lyric-line').forEach(lyric => {
                    lyric.classList.remove('active', 'fade-out');
                });
                
                startSequence();
            }
        });

        function simulateAudioTime() {
            simulatedStartTime = Date.now();
            
            function updateSimulatedTime() {
                if (!isPlaying) return;
                
                const elapsed = (Date.now() - simulatedStartTime) / 1000;

                // Update debug seconds display
                if (debugSettings.ShowSongSeconds) {
                    debugSeconds.textContent = elapsed.toFixed(3);
                }
                
                while (currentLyricIndex < lyricsData.length && 
                       lyricsData[currentLyricIndex].time <= elapsed) {
                    showLyric(currentLyricIndex);
                    currentLyricIndex++;
                }

                if (currentLyricIndex < lyricsData.length) {
                    requestAnimationFrame(updateSimulatedTime);
                } else {
                    setTimeout(() => {
                        currentLyricIndex = 0;
                        isPlaying = false;
                        updateControlPlayerState();
                        songInfo.classList.remove('hide');
                        showControlPlayer();
                        playBtn.textContent = 'PLAY';
                        playBtn.style.pointerEvents = 'auto';
                        
                        // Reset debug display
                        if (debugSettings.ShowSongSeconds) {
                            debugSeconds.textContent = '0.000';
                        }
                        
                        document.querySelectorAll('.lyric-line').forEach(lyric => {
                            lyric.classList.remove('active', 'fade-out');
                        });
                    }, 6000);
                }
            }
            
            updateSimulatedTime();
        }

        audioPlayer.addEventListener('ended', () => {
            isPlaying = false;
            currentLyricIndex = 0;
            updateControlPlayerState();
            songInfo.classList.remove('hide');
            showControlPlayer();
            playBtn.textContent = 'PLAY';
            playBtn.style.pointerEvents = 'auto';
            
            // Reset debug display
            if (debugSettings.ShowSongSeconds) {
                debugSeconds.textContent = '0.000';
            }
            
            document.querySelectorAll('.lyric-line').forEach(lyric => {
                lyric.classList.remove('active', 'fade-out');
            });
        });

        audioPlayer.addEventListener('error', (e) => {
            console.log('Audio error:', e);
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                playBtn.click();
            }
        });
    </script>
</body>
</html>
