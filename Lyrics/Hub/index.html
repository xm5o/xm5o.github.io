<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Hub - Select Your Song</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Animated background particles */
        .background-particles {
            display: none; /* Simplified - no particles */
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .logo {
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            font-weight: 400;
            letter-spacing: 4px;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 1rem;
            color: #888888;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* Songs grid */
        .songs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
        }

        .song-card {
            background: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 0;
            transition: all 0.3s ease;
            cursor: pointer;
            overflow: hidden;
        }

        .song-card:hover {
            transform: translateY(-4px);
            border-color: #555555;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .song-artwork {
            width: 100%;
            height: 200px;
            position: relative;
            overflow: hidden;
            background: #2a2a2a;
        }

        .song-artwork img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .song-artwork.no-image {
            background: linear-gradient(135deg, #333333 0%, #1a1a1a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .song-card:hover .play-overlay {
            opacity: 1;
        }

        .play-icon {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .play-icon::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 16px solid #000;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            margin-left: 3px;
        }

        .song-info {
            padding: 20px;
            text-align: left;
        }

        .song-title {
            font-size: 1.3rem;
            font-weight: 500;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .song-artist {
            font-size: 0.9rem;
            color: #999999;
            font-weight: 300;
            margin-bottom: 8px;
        }

        .song-duration {
            font-size: 0.85rem;
            color: #666666;
            font-weight: 300;
        }

        /* Stats section */
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 60px 0;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #888888;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 40px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 60px;
        }

        .footer-text {
            color: #555555;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* Loading animation */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
        }

        .loading-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .loading-content {
            text-align: center;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #ffffff;
        }

        /* Lyrics Player Container */
        .lyrics-player-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .lyrics-player-container.show {
            opacity: 1;
            visibility: visible;
        }

        .lyrics-player-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Back button */
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #333333;
            color: #ffffff;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 2001;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0;
            visibility: hidden;
        }

        .back-button.show {
            opacity: 1;
            visibility: visible;
        }

        .back-button:hover {
            background: rgba(0, 0, 0, 0.9);
            border-color: #555555;
        }

        .back-arrow {
            font-size: 1rem;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }

            .logo {
                font-size: 2.5rem;
                letter-spacing: 4px;
            }

            .songs-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .stats {
                gap: 40px;
            }

            .stat-number {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="background-particles" id="particles"></div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text">LOADING SONG...</div>
        </div>
    </div>

    <div class="lyrics-player-container" id="lyricsPlayerContainer">
        <button class="back-button" id="backButton" onclick="closeLyricsPlayer()">
            <span class="back-arrow">←</span>
            <span>BACK TO HUB</span>
        </button>
        <iframe class="lyrics-player-iframe" id="lyricsPlayerIframe" src="" title="Lyrics Player"></iframe>
    </div>

    <div class="container">
        <header class="header">
            <h1 class="logo">MUSIC HUB</h1>
            <p class="subtitle">Select your experience</p>
        </header>

        <main class="songs-grid">
            <div class="song-card" onclick="playSong('cry')">
                <div class="song-artwork">
                    <img src="images/cry.jpg" alt="Cry">
                </div>
                <div class="song-info">
                    <h2 class="song-title">Cry</h2>
                    <p class="song-artist">Cigarettes After Sex</p>
                    <p class="song-duration">5:17</p>
                </div>
            </div>

            <div class="song-card" onclick="playSong('coming-soon')">
                <!-- <div class="song-artwork">
                    <div class="play-icon"></div>
                </div> -->
                <div class="song-info">
                    <h2 class="song-title">Coming Soon</h2>
                    <p class="song-artist">More Songs</p>
                    <p class="song-duration">--:--</p>
                </div>
            </div>

            <div class="song-card" onclick="playSong('coming-soon')">
                <!-- <div class="song-artwork">
                    <div class="play-icon"></div>
                </div> -->
                <div class="song-info">
                    <h2 class="song-title">Coming Soon</h2>
                    <p class="song-artist">More Songs</p>
                    <p class="song-duration">--:--</p>
                </div>
            </div>

            <div class="song-card" onclick="playSong('coming-soon')">
                <!-- <div class="song-artwork">
                    <div class="play-icon"></div>
                </div> -->
                <div class="song-info">
                    <h2 class="song-title">Coming Soon</h2>
                    <p class="song-artist">More Songs</p>
                    <p class="song-duration">--:--</p>
                </div>
            </div>
        </main>

        <section class="stats">
            <div class="stat-item">
                <div class="stat-number">1</div>
                <div class="stat-label">Songs Available</div>
            </div>
            <!-- <div class="stat-item">
                <div class="stat-number">∞</div>
                <div class="stat-label">More Coming</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">4K</div>
                <div class="stat-label">Quality</div>
            </div> -->
        </section>

        <footer class="footer">
            <p class="footer-text">Immersive Lyrics Experience</p>
        </footer>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            // Simplified - no particles needed
        }

        // Play song function
        function playSong(songId) {
            const loadingOverlay = document.getElementById('loadingOverlay');
            const lyricsPlayerContainer = document.getElementById('lyricsPlayerContainer');
            const lyricsPlayerIframe = document.getElementById('lyricsPlayerIframe');
            const backButton = document.getElementById('backButton');
            
            if (songId === 'cry') {
                // Show loading overlay
                loadingOverlay.classList.add('show');
                
                // Set the iframe source to the cry lyrics player
                lyricsPlayerIframe.src = 'songs/cry/index.html';
                
                // Wait for loading then show lyrics player
                setTimeout(() => {
                    loadingOverlay.classList.remove('show');
                    lyricsPlayerContainer.classList.add('show');
                    
                    // Show back button after lyrics player appears
                    setTimeout(() => {
                        backButton.classList.add('show');
                    }, 300);
                }, 2000);
            } else {
                // Show coming soon message
                alert('🎵 Coming Soon!\n\nMore songs will be added to the hub.');
            }
        }

        // Close lyrics player function
        function closeLyricsPlayer() {
            const lyricsPlayerContainer = document.getElementById('lyricsPlayerContainer');
            const lyricsPlayerIframe = document.getElementById('lyricsPlayerIframe');
            const backButton = document.getElementById('backButton');
            
            // Hide back button first
            backButton.classList.remove('show');
            
            // Then hide lyrics player
            setTimeout(() => {
                lyricsPlayerContainer.classList.remove('show');
                
                // Clear iframe source after animation
                setTimeout(() => {
                    lyricsPlayerIframe.src = '';
                }, 800);
            }, 100);
        }

        // Add hover sound effect (visual feedback)
        document.querySelectorAll('.song-card').forEach(card => {
            card.addEventListener('mouseenter', () => {
                card.style.transform = 'translateY(-4px)';
            });
            
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'translateY(0)';
            });
        });

        // Initialize particles on load
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
        });

        // Add keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                // Close lyrics player if open
                const lyricsPlayerContainer = document.getElementById('lyricsPlayerContainer');
                if (lyricsPlayerContainer.classList.contains('show')) {
                    closeLyricsPlayer();
                }
            } else if (e.key === 'Enter' || e.key === ' ') {
                const focusedCard = document.activeElement;
                if (focusedCard && focusedCard.classList.contains('song-card')) {
                    e.preventDefault();
                    focusedCard.click();
                }
            }
        });

        // Make cards focusable for accessibility
        document.querySelectorAll('.song-card').forEach((card, index) => {
            card.setAttribute('tabindex', '0');
            card.setAttribute('role', 'button');
            card.setAttribute('aria-label', `Play ${card.querySelector('.song-title').textContent} by ${card.querySelector('.song-artist').textContent}`);
        });
    </script>
</body>
</html>
